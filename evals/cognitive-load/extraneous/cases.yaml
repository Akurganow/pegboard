positive:
  - id: carrier-onboarding-two-months
    prompt: |
      We are nine people on a logistics platform. A new backend engineer needs about two
      months before they can deliver a feature without help, and my VP wants that halved.
      The usual first feature is adding a shipping carrier, which we do about every six
      weeks. From the notes of our last two hires, what they had to learn first:

      - Adding a carrier touches four of our eleven services: carrier-registry, rate-engine,
        label-service and tracking-poller.
      - Rate rules are written in "rateflow", a YAML language we built ourselves and
        interpret at runtime. It has no editor support, and its only documentation is a 2023
        Confluence page.
      - The services call each other through "pipe", our in-house RPC library. Its retry and
        timeout defaults differ from the HTTP client everyone already knows.
      - Carriers are identified by two-letter codes ("DH", "UP", "FX") kept in four places,
        and the lists do not quite agree.

      What should we change first so the next hire becomes productive sooner? After that,
      draft three agenda items for Thursday's onboarding retrospective.
  - id: notifications-too-complex
    prompt: |
      my team keeps calling notifications/ a mess, but when i ask what exactly is wrong i
      get shrugs. this is the function they all complain about:

      ```python
      def send(user, kind, payload, channel=None, template=None, retry=True,
               batch=False, dry_run=False, locale=None, legacy=False):
          ch = channel or user.prefs.get(kind, {}).get("channel") or ("sms" if kind in URGENT else "email")
          tpl = (LEGACY_TEMPLATES if legacy else TEMPLATES)[ch][template or kind]
          body = render(tpl, payload, locale or (None if kind in URGENT else user.locale))
          if dry_run:
              return body
          if batch and kind not in URGENT:
              return digest_queue.add(user.id, ch, body)
          return deliver(ch, user, body, retries=3 if retry else 0)
      ```

      password reset and the weekly marketing digest both go through it, and each team adds
      a flag every month or so.
  - id: release-runbook-first-timers
    prompt: |
      Our iOS release follows a 23-step Notion runbook, and only two of our eight people can
      run it without a mistake. Each of the last three first-timers broke something: a wrong
      build number, a forgotten API flag, and a release to all users instead of 10%. The
      steps that went wrong, abridged:

      4. Set CFBundleVersion in Info.plist to the last number in the "Builds" Google Sheet,
         plus one.
      9. In LaunchDarkly, set ios-min-api to the value from step 6 of the backend release
         runbook (a separate Notion page).
      12. Run scripts/release.sh from the release branch, at least ten minutes after step 9.
          It exits with 3 if the flag has not propagated yet and with 4 if the build number
          is already taken. The runbook's appendix explains the codes.
      17. In App Store Connect, choose phased release. The "Release to all users" box is
          ticked by default; untick it.

      We release every two weeks, and we want anyone on the team to be able to do it. What
      makes this process so easy to get wrong the first time, and what should we change?
  - id: ledger-design-doc-risks
    prompt: |
      I'm writing the design doc for multi-currency support in our ledger service (Kotlin)
      and need its section "Risks in the current posting code", about 200 words. Two
      engineers who have not worked on the ledger join next month. Reviewers of the last
      three changes to this function could only follow it with the account table and the
      flags file open beside it. Every currency change will go through it:

      ```kotlin
      // ledger/src/main/kotlin/posting/Poster.kt
      fun post(tx: Transaction) {
          for (leg in tx.legs) {
              val sign = if (leg.side == 'D') 1 else -1
              val normal = if (leg.account.type in "AE") 1 else -1   // types: A, L, Q, R, E
              val amount = leg.minorUnits * sign * normal
              if ((leg.account.flags and 0x4) != 0 && balances.of(leg.account.id) + amount < 0 && !tx.override) {
                  throw OverdraftException(leg)
              }
              balances.add(leg.account.id, amount)
              if ((leg.account.flags and 0x10) != 0) {
                  mirror.post(leg.copy(side = if (leg.side == 'D') 'C' else 'D'))
              }
          }
      }
      ```

      Account types: A asset, L liability, Q equity, R revenue, E expense. Flag bits: 0x4
      means the account may not go below zero unless the transaction carries an override,
      and 0x10 means every posting is mirrored to the reporting ledger with the sides
      swapped. Write the section so it can go straight into the document.
  - id: upload-form-slow-bugs
    prompt: |
      Our UploadForm component has caused four bugs this quarter, and each one ate several
      days of debugging, even for Priya, who wrote it and knows it best. The latest: after a
      user cancelled an upload, the progress bar never appeared again for their next upload.
      The state and render logic, from src/components/UploadForm.tsx:

      ```tsx
      const [isUploading, setIsUploading] = useState(false);
      const [isDone, setIsDone] = useState(false);
      const [hasError, setHasError] = useState(false);
      const [isRetrying, setIsRetrying] = useState(false);
      const [isCancelled, setIsCancelled] = useState(false);

      // ...nine handlers set these, for example:
      const onStart = () => { setIsUploading(true); setIsDone(false); setHasError(false); };
      const onRetry = () => { setIsRetrying(true); setHasError(false); setIsUploading(true); };
      const onCancel = () => { setIsCancelled(true); setIsUploading(false); };

      return (
        <>
          {isUploading && !isCancelled && !hasError && <Progress />}
          {(isDone || (hasError && !isRetrying)) && !isCancelled && <Summary />}
          {hasError && !isRetrying && <RetryButton onClick={onRetry} />}
          {!isUploading && !isDone && <DropZone />}
        </>
      );
      ```

      We touch this component in most sprints. Why do bugs here take so long to find, and
      what would you change?
  - id: export-view-review-chain
    prompt: |
      Reviewing any change to our CSV exports takes forever: reviewers open four files to
      learn what one cell of the EMEA report contains. The whole chain, abridged:

      ```python
      # exports/base.py
      class ExportView:
          delimiter = ","
          def render(self, rows):
              out = [self.header()]
              for r in rows:
                  out.append(self.delimiter.join(self.cell(c) for c in self.row(r)))
              return "\n".join(out)
          def header(self): return ""
          def row(self, r): return r
          def cell(self, c): return str(c)

      # exports/csv.py
      class CsvExportView(ExportView):
          def header(self): return self.delimiter.join(self.columns)
          def cell(self, c):
              s = super().cell(c)
              return f'"{s}"' if self.delimiter in s else s

      # exports/reports.py
      class ReportExportView(CsvExportView):
          columns = ["id", "date", "total"]
          def row(self, r): return [r.id, r.date, r.total]
          def cell(self, c):
              if isinstance(c, date):
                  return c.isoformat()
              return super().cell(c)

      # exports/emea.py
      class EmeaReportExportView(ReportExportView):
          delimiter = ";"
          def cell(self, c):
              if isinstance(c, Decimal):
                  return str(c).replace(".", ",")
              return super().cell(c)
      ```

      We add a new export about once a month, usually a copy of an existing one with another
      delimiter or number format. Why does reviewing these take so long, and what would you
      change? Is this just how class-based exports go, or did we overdo it?
near_miss:
  - id: speed-up-contact-dedupe
    prompt: |
      I know this function is a mess to read, but readability isn't today's problem: it takes
      nine seconds on a 50k-contact CSV and freezes the import screen. Make it fast. The
      output must stay exactly the same, including which duplicate is kept and the order.

      ```ts
      // src/import/dedupe.ts
      export function dedupeContacts(contacts: Contact[]): Contact[] {
        const kept: Contact[] = [];
        for (const c of contacts) {
          let dup = false;
          for (const k of kept) {
            const samePhone = !!k.phone && !!c.phone &&
              k.phone.replace(/\D/g, "") === c.phone.replace(/\D/g, "");
            if (k.email.toLowerCase() === c.email.toLowerCase() || samePhone) {
              dup = true;
              break;
            }
          }
          if (!dup) kept.push(c);
        }
        return kept;
      }
      ```
  - id: rename-cryptic-locals
    prompt: |
      My reviewer says the names in this function are unreadable. Rename the parameters and
      local variables to something clear and give me the function back. Don't restructure
      anything and keep the function's name, it's called from 30 places.

      ```go
      // pricing/total.go
      func calc(o Order, r []Rate) int64 {
          var t int64
          for _, l := range o.Lines {
              x := l.Qty * l.Cents
              for _, rr := range r {
                  if rr.Code == l.TaxCode {
                      x += x * rr.Bps / 10000
                  }
              }
              t += x
          }
          return t
      }
      ```
  - id: style-guide-lint-overtime
    prompt: |
      Check this file against our team's style guide and list each violation with the rule
      number. Don't fix anything, I'm pasting the list into a PR comment.

      Style guide, docs/STYLE.md (abridged):
      1. A function is at most 30 lines.
      2. Nesting is at most 3 levels deep.
      3. No single-letter names, except i and j as loop indices.

      ```python
      # payroll/overtime.py
      def overtime_pay(e, hours, holiday=False):
          pay = 0
          for d in hours:
              if d.worked > 8:
                  if holiday:
                      if e.contract == "hourly":
                          pay += (d.worked - 8) * e.rate * 2
                  else:
                      pay += (d.worked - 8) * e.rate * 1.5
          return pay
      ```
  - id: first-week-onboarding-checklist
    prompt: |
      Tomás joins our backend team on Monday. Our last new hire spent most of his first week
      waiting for access, so this time I want a checklist ready. Write it as a Markdown list
      grouped by day: the accounts to request (GitHub org, AWS SSO, PagerDuty, Sentry,
      1Password), the repos to clone (api, web, infra), who to meet (his buddy Ana, the tech
      lead, the product manager), and a starter ticket on Thursday.
  - id: explain-cron-expand
    prompt: |
      I'm documenting the helper below, which lives in our scheduler. Explain what each of
      its lines does, in order, and tell me what expand("*/15", 0, 59) returns.

      ```python
      # scheduler/cron.py
      def expand(field, lo, hi):
          out = set()
          for part in field.split(","):
              step = 1
              if "/" in part:
                  part, step = part.split("/")
                  step = int(step)
              if part == "*":
                  a, b = lo, hi
              elif "-" in part:
                  a, b = map(int, part.split("-"))
              else:
                  a = b = int(part)
              out.update(range(a, b + 1, step))
          return sorted(out)
      ```

questions:
  # The review comment, the first prompt.
  finds_swallowed_failure:
    instructions: >-
      The answer says the endpoint still returns a 200 response when
      apply_payment fails.
    cases:
      - webhook-review-comment
  review_label:
    instructions: >-
      The review comment the answer drafts carries a Conventional Comments
      label, such as "issue (blocking):" or "suggestion:".
    criteria:
      "true": >-
        The drafted comment carries a label such as "issue:", "issue
        (blocking):", "suggestion:", "question:" or "nitpick:".
      "false": >-
        The drafted comment carries no such label. A bold title such as
        "Blocking: ..." or a lead-in such as "PR comment:" is not one.
    cases:
      - webhook-review-comment
  fix_not_wish:
    instructions: >-
      The review comment the answer drafts states its fix as an instruction or
      as code, not as a question such as "Could we...?".
    criteria:
      "true": >-
        The fix is an imperative instruction, such as "Log with
        logger.exception and re-raise", or a code block given as the change.
      "false": >-
        The fix is asked as a question, such as "Could we let this exception
        propagate?" or "Would something like this work instead?".
    cases:
      - webhook-review-comment
  # The PR text, the second prompt.
  states_cursor_cause:
    instructions: >-
      The description says rows with the same created_at value could come
      back on two pages.
    cases:
      - export-fix-pr-description
  states_zero_duplicates:
    instructions: >-
      The description says the export on the staging snapshot had no
      duplicate rows.
    cases:
      - export-fix-pr-description
  no_process_narrative:
    instructions: >-
      The PR description tells nothing about how the work went, such as an
      approach tried and reverted, the time spent or a bot's review.
    criteria:
      "true": >-
        The description states the change, its cause and its test results
        only. A note to the user outside the description does not count.
      "false": >-
        The description mentions an approach tried and reverted, such as the
        OFFSET attempt, the time spent, or a bot's review.
    cases:
      - export-fix-pr-description
  artifact_alone:
    instructions: >-
      The answer is the PR description alone, with no note before or after it.
    criteria:
      "true": >-
        The answer is the description and nothing else. Headings and sections
        inside it are part of it.
      "false": >-
        A note sits before or after the description, such as what was left
        out or another version to choose from.
    cases:
      - export-fix-pr-description
  # The comments in the Go file, the third prompt.
  keeps_redis_comment:
    instructions: >-
      The answer says the comment about Redis rejecting an EX of 0 stays.
    cases:
      - go-comments-before-merge
  findings_not_rewrite:
    instructions: >-
      The answer lists what to change and gives no rewritten version of the
      whole text.
    cases:
      - go-comments-before-merge
  hedge_comment_dropped:
    instructions: >-
      The answer says to delete the "should work for negative values too"
      comment, not to reword it.
    criteria:
      "true": >-
        The answer says to delete that comment, and to test or fix the code
        instead.
      "false": >-
        The answer offers to keep a comment about negative values in new
        words, such as a note that states the behaviour or documents it.
    cases:
      - go-comments-before-merge
  # The incident update, the fourth prompt. Each question names one fact of the source.
  cause_kept:
    instructions: >-
      The shortened update says an expired TLS certificate on the payments
      gateway caused the errors.
    cases:
      - shorten-incident-update
  recovery_time_kept:
    instructions: >-
      The shortened update says error rates were back to normal at 14:52 UTC.
    cases:
      - shorten-incident-update
  customer_impact_kept:
    instructions: >-
      The shortened update says some customers may have seen failed payments.
    cases:
      - shorten-incident-update
  follow_up_kept:
    instructions: >-
      The shortened update says the team is identifying the affected orders
      so that it can contact the customers.
    cases:
      - shorten-incident-update
  cuts_quoted:
    instructions: >-
      The answer quotes the words it cut, such as "just wanted to give everyone",
      instead of describing them, such as "the filler phrases".
    cases:
      - shorten-incident-update
  # The report and the brief, the fifth prompt.
  names_pool_cause:
    instructions: >-
      The report says the checkout errors came from the api-gateway connection
      pool running out at 50 connections.
    cases:
      - outage-report-and-brief
  states_untested_in_prod:
    instructions: >-
      The report says the new cap has not been tested in production.
    cases:
      - outage-report-and-brief
  names_decision:
    instructions: >-
      The report says the director has to decide today whether to ship the
      cap of 200.
    cases:
      - outage-report-and-brief
  forbids_production:
    instructions: >-
      The brief says the agent must not touch production.
    cases:
      - outage-report-and-brief
  states_done_check:
    instructions: >-
      The brief says what shows that the mobile retry test is done.
    cases:
      - outage-report-and-brief

      - name-for-batch-function
  proposes_name:
    instructions: >-
      The answer proposes at least one specific new name for the function.
    cases:
      - name-for-batch-function
  layers_only_forward:
    instructions: >-
      The answer says CustomerFacade and CustomerManager only pass the call on
      and add nothing.
    cases:
      - six-layer-customer-api
  future_need_not_a_reason:
    instructions: >-
      The answer says that a layer kept for a future need is not a reason to

questions:
  concrete_change: >-
    The answer recommends a specific change to a named part of the system.
  matrix_cell_quoted:
    instructions: >-
      The answer quotes a line of the contradiction matrix with its two
      parameter numbers.
    cases:
      - photo-quality-middle-setting
      - merge-check-vs-full-e2e
  build_time_out_of_binary:
    instructions: >-
      The answer says that the clock time at which the build runs must no longer
      be written into the binary.
    cases:
      - reproducible-build-vs-timestamp
  deliverable_ticket_comment:
    instructions: >-
      The answer contains text addressed to a ticket that explains the change.
    cases:
      - reproducible-build-vs-timestamp
  gallery_lighter_than_full_view:
    instructions: >-
      The answer keeps the full-resolution photo for the full view and loads
      less image data in the gallery.
    cases:
      - photo-quality-middle-setting
  mistyped_code_handled:
    instructions: >-
      The answer proposes a way to catch or tolerate a mistyped code.
    cases:
      - reset-code-long-and-short
  deliverable_letter_wording:
    instructions: >-
      The answer contains wording for the letter that tells the customer how to
      use the code.
    cases:
      - reset-code-long-and-short
  pr_check_skips_full_run:
    instructions: >-
      The answer stops the pull request check from waiting for the full
      end-to-end run.
    cases:
      - merge-check-vs-full-e2e

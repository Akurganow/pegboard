    cases:
      - six-layer-customer-api
  cart_flag_guards_recursion:
    instructions: >-
      The answer says the global discountApplied flag exists only to stop
      applyDiscount and recalcTotals from calling each other endlessly.
    cases:
      - tangled-cart-totals
  apply_discount_must_not_call_recalc:
    instructions: >-
      The answer says that applyDiscount must not call recalcTotals.
    cases:
      - tangled-cart-totals
  delete_defined_away:
    instructions: >-
      The answer says delete() should succeed quietly when the session is
      already gone, so callers need no try/except.
    cases:
      - session-delete-try-except
  cleanup_search_filters_first:
    instructions: >-
      The answer recommends starting with catalog/search_filters.py.
    cases:
      - cleanup-sprint-priorities
  sprint_goal:
    instructions: >-
      The answer includes a sprint goal for the planning doc.
    cases:
      - cleanup-sprint-priorities
  states_cost:
    instructions: >-
      The answer states what its main recommendation costs or gives up, such as
